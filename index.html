   onSearch : 「この条件で検索する」を押したとき（cond＝検索条件）
   onKeep   : 「キープする」を押したとき（job＝求人, kept＝キープ中か）
   onDetail : 「詳細を見る」を押したとき
   onApply  : 詳細画面の「この求人に応募する」を押したとき
   onLogin  : 「ご利用登録 / ログイン」を押したとき            */
function onSearch(cond){}
function onKeep(job,kept){}
function onDetail(job){}
function onApply(job){toast("応募を受け付けました（デモのため実際には送信されません）")}
function onLogin(){toast("デモのためログインは未実装です")}
/* ========== ここまで ========== */
function imgTag(j){const s=IMG[j.no]||IMGC[j.cat];return s?`<div class="img"><img src="${s}" alt="" loading="lazy"></div>`:`<div class="img" style="background-color:${CC[j.cat]}">${j.cat}</div>`}
const CC={"飲食・フード":"#b8815a","コンビニ・スーパー":"#5f86b5","販売・接客":"#a8708b","軽作業・物流":"#7b8a62","事務・オフィスワーク":"#6b7f99","教育・塾講師":"#8672a8","イベント・スタッフ":"#b87a62","ライター・クリエイティブ":"#4f9a96","学童・保育補助":"#c09a4f"};
const LINES=[...new Set(D.map(j=>j.line))];
const OPT={pref:["エリアから探す",REG],line:["路線・駅選択",{"路線":LINES}],cat:["職種選択",{"職種":Object.keys(C)}],tag:["こだわり選択",{"こだわり":TAGS}]};
const S={pref:new Set(),line:new Set(),cat:new Set(),tag:new Set()},K=new Set(),H=[];
let view="list",page=1,applied={kw:""};
const $=i=>document.getElementById(i),PER=10;
function lab(){document.querySelectorAll(".pick").forEach(b=>{const n=S[b.dataset.k].size;b.textContent=n?n+"件選択中":"選択する";b.classList.toggle("has",!!n)})}
document.querySelectorAll(".pick").forEach(b=>b.onclick=()=>picker(b.dataset.k));
function picker(k){
 const[t,g]=OPT[k];
 $("sh").innerHTML=`<div class="t"><span>${t}</span><button id="x">×</button></div><div class="bd">${Object.entries(g).map(([h,a])=>`<h4>${h}</h4>${a.map(v=>`<label class="ck"><input type="checkbox" value="${v}" ${S[k].has(v)?"checked":""}><span>${v}</span></label>`).join("")}`).join("")}</div><div class="ft"><button class="btn fill" id="ok">選択完了</button></div>`;
 $("ov").classList.add("show");$("x").onclick=close;
 $("ok").onclick=()=>{S[k]=new Set([...document.querySelectorAll(".bd input:checked")].map(i=>i.value));close();lab();page=1;render()};
}
function close(){$("ov").classList.remove("show")}
$("ov").onclick=e=>{if(e.target===$("ov"))close()};
function jobDetail(no){
 const j=D.find(x=>x.no===no);H.unshift(j.no);onDetail(j);if(H.length>20)H.pop();
 $("sh").innerHTML=`<div class="t"><span>求人番号：${j.no}</span><button id="x">×</button></div><div class="bd"><div class="co" style="color:var(--mute)">${j.co}</div><h3>${j.t}</h3><p>${j.d}</p><dl class="tb"><dt>${j.kind}</dt><dd class="wage">${j.w}</dd><dt>職種</dt><dd>${j.cat}</dd><dt>勤務地</dt><dd>${j.pref} ${j.city}<br>【${j.line}】${j.sta} 徒歩 ${j.walk} 分</dd></dl><div class="tags">${j.tag.map(t=>`<span>${t}</span>`).join("")}</div></div><div class="ft"><button class="btn fill" id="ap">この求人に応募する</button></div>`;
 $("ov").classList.add("show");$("x").onclick=close;
 $("ap").onclick=()=>{close();onApply(j)};
}
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600)}
function filt(){
 const kw=applied.kw.toLowerCase().split(/\s+/).filter(Boolean);
 let r=D.filter(j=>(!S.pref.size||S.pref.has(j.pref))&&(!S.line.size||S.line.has(j.line))&&(!S.cat.size||S.cat.has(j.cat))&&[...S.tag].every(t=>j.tag.includes(t))&&kw.every(w=>(j.t+j.co+j.d+j.cat+j.city+j.sta+j.pref).toLowerCase().includes(w)));
 if(view==="keep")r=r.filter(j=>K.has(j.no));
 if(view==="hist")r=H.map(n=>D.find(j=>j.no===n)).filter(j=>r.includes(j));
 return r;
}
const GRP=[["三洋進学スクール","「入学試験」の試験監督です。","◆試験監督業務の経験者大歓迎！◆未経験でもマニュアルに沿って正確に動ける方なら勤務可能です。","この求人一覧を見る(201件)"],["トマス個別指導塾","＼高時給！週1日1授業～OK！完全1対1の個別指導／初めてでも安心な塾バイトです","◆授業時給1,600円～◆昇給あり！3ヶ月に1度の査定で頑張りを評価。全校舎駅から数分の好立地。","この求人一覧を見る(114件)"]];
function render(){
 const r=filt(),n=r.length,max=Math.max(1,Math.ceil(n/PER));if(page>max)page=max;
 const s=(page-1)*PER,items=r.slice(s,s+PER);
 $("kc").textContent=K.size;
 document.querySelectorAll("nav [data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 $("rc").innerHTML=`${{list:"検索結果",keep:"キープ中",hist:"最近見た"}[view]}<b>${n.toLocaleString()}</b>件${n?`（${s+1}〜${s+items.length}件を表示）`:""}`;
 const show=view==="list"&&page===1&&!S.pref.size&&!S.line.size&&!S.cat.size&&!S.tag.size&&!applied.kw;
 $("list").innerHTML=(show?GRP.map(g=>`<div class="grp"><div class="co">${g[0]}</div><h3>${g[1]}</h3><p>${g[2]}</p><button class="btn fill" onclick="toast('サンプルのため一覧は準備中です')">${g[3]}</button></div>`).join(""):"")+
 (items.length?items.map(j=>`<div class="job"><div class="co">${j.isNew?'<span class="new">NEW</span>':""}${j.co}</div><h3>${j.t}</h3><div class="jb"><div>${imgTag(j)}<div class="no">求人番号：${j.no}</div></div><div><p class="desc">${j.d}</p><dl class="tb"><dt>${j.kind}</dt><dd class="wage">${j.w}</dd><dt>職種</dt><dd>${j.cat}</dd><dt>勤務地</dt><dd>${j.pref} ${j.city}<br>【${j.line}】${j.sta} 徒歩 ${j.walk} 分</dd></dl><div class="tags">${j.tag.map(t=>`<span>${t}</span>`).join("")}</div></div></div><div class="act"><button class="btn" data-k="${j.no}">${K.has(j.no)?"キープ済み":"キープする"}</button><button class="btn fill" data-d="${j.no}">詳細を見る</button></div></div>`).join(""):`<div class="empty">条件に合う求人が見つかりませんでした。</div>`);
 let p="";if(max>1){for(let i=1;i<=max;i++)p+=`<button class="${i===page?"on":""}" data-p="${i}">${i}</button>`}
 $("pg").innerHTML=p;
}
$("list").onclick=e=>{const k=e.target.closest("[data-k]"),d=e.target.closest("[data-d]");
 if(k){const n=+k.dataset.k;K.has(n)?K.delete(n):K.add(n);onKeep(D.find(x=>x.no===n),K.has(n));render()}else if(d)jobDetail(+d.dataset.d)};
$("pg").onclick=e=>{const b=e.target.closest("[data-p]");if(b){page=+b.dataset.p;render();scrollTo({top:0})}};
document.querySelectorAll("nav [data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;page=1;render()});
$("go").onclick=()=>{applied.kw=$("kw").value.trim();page=1;view="list";onSearch({word:applied.kw,pref:[...S.pref],line:[...S.line],cat:[...S.cat],tag:[...S.tag]});render()};
$("kw").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("reg").onclick=()=>onLogin();
$("home").onclick=()=>{Object.values(S).forEach(s=>s.clear());$("kw").value="";applied.kw="";view="list";page=1;lab();render()};
lab();render();
</script>
